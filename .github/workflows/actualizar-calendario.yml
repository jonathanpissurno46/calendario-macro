name: Actualizar calendario

on:
  schedule:
    # Cada 10 minutos, pero empezando en el minuto 4 y no en el 0.
    # GitHub recomienda evitar las horas "redondas" (:00, :10, :20...) porque
    # es cuando mas carga tiene y puede retrasar o descartar la ejecucion.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar el calendario y los valores reales
        run: |
          if [ -f scripts/actualizar-calendario.py ]; then
            python3 scripts/actualizar-calendario.py
          else
            echo "AVISO: falta scripts/actualizar-calendario.py."
            echo "Se descarga solo el calendario base con las previsiones."
            curl -fsS --max-time 45 -A "Mozilla/5.0" -o datos.json \
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
            head -c 1 datos.json | grep -q '\[' || { echo "respuesta no valida"; exit 1; }
          fi

      - name: Guardar si ha cambiado
        run: |
          git config user.name "Calendario Bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos.json
          git diff --staged --quiet && echo "sin cambios" || git commit -m "Actualiza calendario"
          git push
